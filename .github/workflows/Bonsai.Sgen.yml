# =======================================================================================================================================================================
# Bonsai.Sgen CI/CD
# =======================================================================================================================================================================
# Index:
# * Build .NET
# * Build Python
# * Build documentation
# * Render workflow images
# * Publish packages to GitHub
# * Publish packages to NuGet.org
# * Publish to PyPI
# * Publish documentation
# =======================================================================================================================================================================
# Note that this is a generic workflow meant for Bonsai packages with a Python package. Minor local modifications are fine, see https://github.com/bonsai-rx/prefect.
# =======================================================================================================================================================================
name: Bonsai.Sgen
on:
  push:
    # This prevents tag pushes from triggering this workflow
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish-documentation:
        description: "Publish documentation to GitHub Pages?"
        default: "false"
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  ContinuousIntegrationBuild: true
jobs:
  # =====================================================================================================================================================================
  # Build .NET
  #  ___      _ _    _     _  _ ___ _____
  # | _ )_  _(_) |__| |   | \| | __|_   _|
  # | _ \ || | | / _` |  _| .` | _|  | |
  # |___/\_,_|_|_\__,_| (_)_|\_|___| |_|
  #
  # =====================================================================================================================================================================
  build-dotnet:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
          - name: Linux x64
            os: ubuntu-22.04
            rid: linux-x64
        configuration: ['debug', 'release']
        include:
          - platform:
              rid: win-x64
            configuration: release
            collect-packages: true
    name: Build .NET (${{matrix.platform.name}} ${{matrix.configuration}})
    runs-on: ${{matrix.platform.os}}
    outputs:
      need-workflow-image-render: ${{steps.configure-build.outputs.need-workflow-image-render}}
    steps:
      # ----------------------------------------------------------------------- Checkout
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # ----------------------------------------------------------------------- Set up tools
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      # ----------------------------------------------------------------------- Configure build
      - name: Configure build
        id: configure-build
        uses: bonsai-rx/configure-build@v3

      # ----------------------------------------------------------------------- Build
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration ${{matrix.configuration}}

      # ----------------------------------------------------------------------- Pack
      - name: Pack
        id: pack
        run: dotnet pack --no-restore --no-build --configuration ${{matrix.configuration}}

      # ----------------------------------------------------------------------- Test
      - name: Test .NET Framework 4.7.2
        run: dotnet test --no-restore --no-build --configuration ${{matrix.configuration}} --verbosity normal --framework net472
      - name: Test .NET 8
        run: dotnet test --no-restore --no-build --configuration ${{matrix.configuration}} --verbosity normal --framework net8.0
      - name: Test .NET 8 Windows
        if: matrix.platform.rid == 'win-x64'
        run: dotnet test --no-restore --no-build --configuration ${{matrix.configuration}} --verbosity normal --framework net8.0-windows

      # ----------------------------------------------------------------------- Regenerate code
      - name: Test JSON serializer generation
        working-directory: ./docs
        run: pwsh ./process-schemas.ps1 -SchemaPath workflows/person.json -SgenPath ../artifacts/bin/Bonsai.Sgen/${{matrix.configuration}} -Serializer json -Verbose
      - name: Test YAML serializer generation
        working-directory: ./docs
        run: pwsh ./process-schemas.ps1 -SchemaPath "workflows/person-*.json" -SgenPath ../artifacts/bin/Bonsai.Sgen/${{matrix.configuration}} -Serializer yaml -Verbose
      - name: Test JSON and YAML serializer generation
        working-directory: ./docs
        shell: pwsh
        run: ./process-schemas.ps1 -SchemaPath workflows/external-union-member.json -SgenPath ../artifacts/bin/Bonsai.Sgen/${{matrix.configuration}} -Serializer json,yaml -Verbose
      - name: Verify pre-generated code is up to date
        id: verify-dist
        run: |
          git add . --intent-to-add --ignore-removal
          git diff --name-status --ignore-matching-lines 'System.CodeDom.Compiler.GeneratedCodeAttribute' --exit-code

      # ----------------------------------------------------------------------- Collect artifacts
      - name: Collect NuGet packages
        uses: actions/upload-artifact@v7
        if: matrix.collect-packages && steps.pack.outcome == 'success' && always()
        with:
          name: Packages
          if-no-files-found: error
          path: artifacts/package/${{matrix.configuration}}/**

  # =====================================================================================================================================================================
  # Build Python
  #  ___      _ _    _   ___      _   _
  # | _ )_  _(_) |__| | | _ \_  _| |_| |_  ___ _ _
  # | _ \ || | | / _` | |  _/ || |  _| ' \/ _ \ ' \
  # |___/\_,_|_|_\__,_| |_|  \_, |\__|_||_\___/_||_|
  #                          |__/
  # =====================================================================================================================================================================
  build-python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        include:
          - python-version: '3.11'
            collect-packages: true
    name: Build Python (${{matrix.python-version}})
    runs-on: windows-latest
    steps:
      # ----------------------------------------------------------------------- Checkout
      - name: Checkout
        uses: actions/checkout@v7

      # ----------------------------------------------------------------------- Set up tools
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{matrix.python-version}}
          enable-cache: true

      # ----------------------------------------------------------------------- Configure build
      - name: Configure build
        uses: bonsai-rx/configure-build@v3

      # ----------------------------------------------------------------------- Restore
      - name: Restore
        run: uv sync --locked

      # ----------------------------------------------------------------------- Check
      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run pyright

      # ----------------------------------------------------------------------- Test
      - name: Test
        run: uv run pytest

      # ----------------------------------------------------------------------- Build
      - name: Build
        if: matrix.collect-packages
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{env.CiBuildVersion}}
        run: uv build

      - name: Verify setuptools-scm applied the build version
        if: matrix.collect-packages
        shell: bash
        run: |
          ls -1 dist/
          if ls dist/*-0.0.0.tar.gz >/dev/null 2>&1; then
            echo "::error::Built version 0.0.0, so setuptools-scm did not apply the build version. Check that pyproject.toml still declares a tool.setuptools_scm table."
            exit 1
          fi

      # ----------------------------------------------------------------------- Collect artifacts
      - name: Collect Python packages
        if: matrix.collect-packages
        uses: actions/upload-artifact@v7
        with:
          name: PythonPackages
          if-no-files-found: error
          path: dist/*

  # =====================================================================================================================================================================
  # Build documentation
  #  ___      _ _    _      _                            _        _   _
  # | _ )_  _(_) |__| |  __| |___  __ _  _ _ __  ___ _ _| |_ __ _| |_(_)___ _ _
  # | _ \ || | | / _` | / _` / _ \/ _| || | '  \/ -_) ' \  _/ _` |  _| / _ \ ' \
  # |___/\_,_|_|_\__,_| \__,_\___/\__|\_,_|_|_|_\___|_||_\__\__,_|\__|_\___/_||_|
  # =====================================================================================================================================================================
  build-documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      # ----------------------------------------------------------------------- Checkout
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # ----------------------------------------------------------------------- Set up tools
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Set up .NET tools
        run: dotnet tool restore

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      # ----------------------------------------------------------------------- Configure build
      - name: Configure build
        id: configure-build
        uses: bonsai-rx/configure-build@v3

      # ----------------------------------------------------------------------- Restore
      - name: Restore
        run: dotnet restore

      # ----------------------------------------------------------------------- Build metadata
      - name: Build metadata
        id: build-metadata
        run: dotnet docfx metadata docs/docfx.json --noRestore

      - name: Build Python API metadata
        run: uv run --locked docs/bonsai-docfx/scripts/generate-python-api.py

      # ----------------------------------------------------------------------- Build documentation
      - name: Build documentation
        id: build-documentation
        run: dotnet docfx build docs/docfx.json

      # ----------------------------------------------------------------------- Collect artifacts
      - name: Collect documentation metadata
        uses: actions/upload-artifact@v7
        if: steps.build-metadata.outcome == 'success' && always()
        with:
          name: DocumentationMetadata
          if-no-files-found: error
          path: artifacts/docs/api/

      - name: Collect documentation artifact
        uses: actions/upload-artifact@v7
        if: steps.build-documentation.outcome == 'success' && always()
        with:
          name: DocumentationWebsite
          if-no-files-found: error
          path: artifacts/docs/site/

  # =====================================================================================================================================================================
  # Render workflow images
  #  ___             _                          _    __ _              _
  # | _ \___ _ _  __| |___ _ _  __ __ _____ _ _| |__/ _| |_____ __ __ (_)_ __  __ _ __ _ ___ ___
  # |   / -_) ' \/ _` / -_) '_| \ V  V / _ \ '_| / /  _| / _ \ V  V / | | '  \/ _` / _` / -_|_-<
  # |_|_\___|_||_\__,_\___|_|    \_/\_/\___/_| |_\_\_| |_\___/\_/\_/  |_|_|_|_\__,_\__, \___/__/
  #                                                                                |___/
  # =====================================================================================================================================================================
  workflow-images:
    name: Render workflow images
    runs-on: windows-latest
    needs: build-dotnet
    if: needs.build-dotnet.outputs.need-workflow-image-render == 'true'
    steps:
      # ----------------------------------------------------------------------- Checkout
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # ----------------------------------------------------------------------- Download built packages
      - name: Download packages for rendering
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: artifacts/packages/

      # ----------------------------------------------------------------------- Set up Bonsai environments
      - name: Set up Bonsai environments
        uses: bonsai-rx/setup-bonsai@v2
        with:
          environment-paths: '**/.bonsai/'
          inject-packages: artifacts/packages/*.nupkg

      # ----------------------------------------------------------------------- Render
      - name: Render images
        id: render
        run: pwsh ./docs/export-images.ps1 -OutputFolder artifacts/docs/site/ -Verbose

      # ----------------------------------------------------------------------- Collect artifacts
      - name: Collect images
        uses: actions/upload-artifact@v7
        if: steps.render.outcome == 'success' && always()
        with:
          name: DocumentationWorkflowImages
          if-no-files-found: error
          path: artifacts/docs/site/

  # =====================================================================================================================================================================
  # Publish packages to GitHub
  #  ___      _    _ _    _                    _                      _          ___ _ _   _  _      _
  # | _ \_  _| |__| (_)__| |_    _ __  __ _ __| |____ _ __ _ ___ ___ | |_ ___   / __(_) |_| || |_  _| |__
  # |  _/ || | '_ \ | (_-< ' \  | '_ \/ _` / _| / / _` / _` / -_|_-< |  _/ _ \ | (_ | |  _| __ | || | '_ \
  # |_|  \_,_|_.__/_|_/__/_||_| | .__/\__,_\__|_\_\__,_\__, \___/__/  \__\___/  \___|_|\__|_||_|\_,_|_.__/
  #                             |_|                    |___/
  # =====================================================================================================================================================================
  publish-github:
    name: Publish packages to GitHub
    runs-on: ubuntu-latest
    needs: [build-dotnet, build-python]
    permissions:
      # Needed to upload to GitHub Packages
      packages: write
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      # ----------------------------------------------------------------------- Set up .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      # ----------------------------------------------------------------------- Download built packages
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: artifacts/packages/

      # ----------------------------------------------------------------------- Push to GitHub Packages
      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/packages/*.nupkg" --skip-duplicate --no-symbols --api-key ${{secrets.GITHUB_TOKEN}} --source https://nuget.pkg.github.com/${{github.repository_owner}}
        env:
          # This is a workaround for https://github.com/NuGet/Home/issues/9775
          DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER: 0

  # =====================================================================================================================================================================
  # Publish packages to NuGet.org
  #  ___      _    _ _    _                    _                      _         _  _       ___     _
  # | _ \_  _| |__| (_)__| |_    _ __  __ _ __| |____ _ __ _ ___ ___ | |_ ___  | \| |_  _ / __|___| |_   ___ _ _ __ _
  # |  _/ || | '_ \ | (_-< ' \  | '_ \/ _` / _| / / _` / _` / -_|_-< |  _/ _ \ | .` | || | (_ / -_)  _|_/ _ \ '_/ _` |
  # |_|  \_,_|_.__/_|_/__/_||_| | .__/\__,_\__|_\_\__,_\__, \___/__/  \__\___/ |_|\_|\_,_|\___\___|\__(_)___/_| \__, |
  #                             |_|                    |___/                                                    |___/
  # =====================================================================================================================================================================
  publish-nuget-org:
    name: Publish packages to NuGet.org
    runs-on: ubuntu-latest
    environment: public-release
    needs: [build-dotnet, build-python]
    if: github.event_name == 'release'
    permissions:
      # Needed to attach files to releases
      contents: write
      # Needed to request the OIDC token for NuGet.org trusted publishing
      id-token: write
    steps:
      # ----------------------------------------------------------------------- Set up .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      # ----------------------------------------------------------------------- Download built packages
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: artifacts/packages/

      # ----------------------------------------------------------------------- Upload release assets
      - name: Upload release assets
        run: gh release upload --repo ${{github.repository}} ${{github.event.release.tag_name}} artifacts/packages/* --clobber
        env:
          GH_TOKEN: ${{github.token}}

      # ----------------------------------------------------------------------- Push to NuGet.org
      - name: Log in to NuGet.org with OIDC
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{secrets.NUGET_USER}}

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} --source ${{vars.NUGET_API_URL}}
        env:
          # This is a workaround for https://github.com/NuGet/Home/issues/9775
          DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER: 0

  # =====================================================================================================================================================================
  # Publish to PyPI
  #  ___      _    _ _    _      _         ___      ___ ___
  # | _ \_  _| |__| (_)__| |_   | |_ ___  | _ \_  _| _ \_ _|
  # |  _/ || | '_ \ | (_-< ' \  |  _/ _ \ |  _/ || |  _/| |
  # |_|  \_,_|_.__/_|_/__/_||_|  \__\___/ |_|  \_, |_| |___|
  #                                            |__/
  # =====================================================================================================================================================================
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-dotnet, build-python]
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      # Needed to attach files to releases
      contents: write
      # Needed by uv publish to exchange a token with PyPI trusted publishing
      id-token: write
    steps:
      # ----------------------------------------------------------------------- Download built packages
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: PythonPackages
          path: dist/

      # ----------------------------------------------------------------------- Upload release assets
      - name: Upload release assets
        run: gh release upload --repo ${{github.repository}} ${{github.event.release.tag_name}} dist/* --clobber
        env:
          GH_TOKEN: ${{github.token}}

      # ----------------------------------------------------------------------- Set up tools
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      # ----------------------------------------------------------------------- Publish
      - name: Publish to PyPI
        run: uv publish

  # =====================================================================================================================================================================
  # Publish documentation
  #  ___      _    _ _    _         _                            _        _   _
  # | _ \_  _| |__| (_)__| |_    __| |___  __ _  _ _ __  ___ _ _| |_ __ _| |_(_)___ _ _
  # |  _/ || | '_ \ | (_-< ' \  / _` / _ \/ _| || | '  \/ -_) ' \  _/ _` |  _| / _ \ ' \
  # |_|  \_,_|_.__/_|_/__/_||_| \__,_\___/\__|\_,_|_|_|_\___|_||_\__\__,_|\__|_\___/_||_|
  # =====================================================================================================================================================================
  publish-documentation:
    name: Publish documentation
    runs-on: ubuntu-latest
    # Publishing is not strictly necessary here, but if we're going to do a public release we want to wait to publish the docs until it goes out
    needs: [build-documentation, workflow-images, publish-nuget-org, publish-pypi]
    permissions:
      # Both required by actions/deploy-pages
      pages: write
      id-token: write
    environment:
      # Intentionally not using the "default" github-pages environment as it's not compatible with this workflow
      name: documentation-website
      url: ${{steps.publish.outputs.page_url}}
    # Only run if the workflow isn't dying and build-documentation was successful and either A) we're releasing or B) we have continuous deployment enabled
    if: |
      !cancelled() && !failure() && needs.build-documentation.result == 'success'
      && (github.event_name == 'release'
        || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish-documentation == 'true')
        || (vars.CONTINUOUS_DOCUMENTATION && github.event_name != 'pull_request')
      )
    steps:
      # ----------------------------------------------------------------------- Download documentation website components
      # It is intentional that we use two independent download steps here as it ensures that workflow images are permitted
      # to overwrite any conflicts in the docfx output but not the other way around.
      - name: Download documentation website
        uses: actions/download-artifact@v8
        with:
          name: DocumentationWebsite

      - name: Download workflow images
        if: ${{needs.workflow-images.result == 'success'}}
        uses: actions/download-artifact@v8
        with:
          name: DocumentationWorkflowImages

      # ----------------------------------------------------------------------- Collect artifacts
      - name: Upload final documentation website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      # ----------------------------------------------------------------------- Publish to GitHub Pages
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v5