[project]
name = "bonsai-sgen"
dynamic = ["version"]
description = "Pydantic base classes for types generated by Bonsai.Sgen."
license = "MIT"
license-files = ["LICENSE"]
readme = "src/bonsai/sgen/README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8"]

[project.urls]
Documentation = "https://bonsai-rx.org/sgen"
Repository = "https://github.com/bonsai-rx/sgen"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bonsai*"]

[tool.setuptools.exclude-package-data]
"bonsai.sgen" = ["README.md"]

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8", "pyyaml>=6", "ruff>=0.11"]

[tool.ruff]
line-length = 100
include = ["src/bonsai/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src/bonsai", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.docfx-tools]
inventories = ["https://docs.pydantic.dev/latest/objects.inv"]
